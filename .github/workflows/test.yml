name: Test formula

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew tap yosyus-Yo/tap
      - run: brew trust --formula yosyus-Yo/tap/ai-observer
      - run: brew install yosyus-Yo/tap/ai-observer
      - run: ai-observer --version
      - run: brew test ai-observer
