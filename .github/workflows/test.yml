name: Test formula

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install --formula ./Formula/ai-observer.rb
      - run: ai-observer --version
      - run: brew test ai-observer
